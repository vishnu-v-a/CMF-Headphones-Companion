[package]
name = "cmf-eq"
version = "0.1.0"
description = "CMF Headphone Pro EQ companion"
edition = "2021"

[lib]
name = "cmf_eq"
path = "src/lib.rs"

[[bin]]
name = "cmf-eq"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:serde", "dep:serde_json", "dep:tauri-build", "tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
