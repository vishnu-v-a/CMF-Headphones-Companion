name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache/restore@v4
        id: android-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/aarch64-linux-android
            target/debug
          key: android-arm64-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-arm64-v1-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cmf-android-debug-signing-v1
      - name: Install Android SDK and Tauri CLI
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" 2>&1 | tee android-sdk.log
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Android project
        run: |
          set -o pipefail
          npx --no-install tauri icon ui/brand-mark.svg --output icons/android
          npx --no-install tauri android init --ci --skip-targets-install 2>&1 | tee android-init.log
          python tools/prepare_android.py
          # Restored Rust build outputs must regenerate Kotlin files in this fresh project.
          find "$HOME/.cargo/registry/src" -name build.rs \( -path '*/wry-*/*' -o -path '*/tao-*/*' -o -path '*/tauri-*/*' \) -exec touch {} +
      - name: Build installable ARM64 APK
        run: |
          set -o pipefail
          npx --no-install tauri android build --debug --apk --target aarch64 --features app --ci 2>&1 | tee android-build.log
      - name: Report bounded build failure
        if: failure()
        run: python tools/report_android_failure.py
      - uses: actions/upload-artifact@v4
        with:
          name: cmf-eq-android-arm64
          path: gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.android-cache.outputs.cache-hit != 'true' && steps.android-cache.outputs.cache-primary-key != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/aarch64-linux-android
            target/debug
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
